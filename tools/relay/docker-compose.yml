# TD-Hub-Relay für Synology Container Manager (Projekt) oder docker compose.
# Nimmt das importierte Image tdhub-relay:latest (tools/relay/image_bauen.sh), sonst baut es das
# Image aus dem Dockerfile in diesem Ordner.
services:
  tdhub-relay:
    image: tdhub-relay:latest
    build: .
    container_name: tdhub-relay
    restart: unless-stopped
    ports:
      - "24565:24565/tcp"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
