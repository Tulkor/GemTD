<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TD Hub Balance-Editor</title>
<!--
  Balance-Editor für GemTD, eeveTD und Shopping Maul. Läuft ohne Installation im Browser (Edge/Chrome).
  Daten kommen entweder eingebettet (tools/balance_editor/bauen.py) oder aus einem Repo-Ordner ("Ordner öffnen").
  Gespeichert wird direkt in den Ordner oder als Änderungsdatei für tools/balance_anwenden.py.
  Anleitung: tools/balance_editor/README.md
-->
<style>
/*FONTS*/
:root {
  --bg: #07040e; --bar: #0d0618; --panel: #0d0618; --panel2: #160b28; --border: #3b2560; --border2: #5b3a8a;
  --text: #f2eaff; --muted: #a99cc8; --gold: #ff4fd8; --cyan: #22c4ee; --coin: #ffd166;
  --have: #5fe08a; --missing: #ff5d7a; --purple-light: #b38cff;
}
* { box-sizing: border-box; border-radius: 0 !important; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px "DejaVu Sans Mono", Consolas, monospace; }
body { padding: 16px; }
button, select, input, textarea { font: inherit; color: var(--text); }
h1 { margin: 0; font-size: 26px; font-weight: bold; color: var(--gold); text-shadow: 3px 3px 0 var(--cyan); letter-spacing: 1px; }
h2 { margin: 0 0 10px; font-size: 15px; font-weight: bold; text-transform: uppercase; color: var(--gold); text-shadow: 2px 2px 0 var(--cyan); }
.panel { background: var(--panel); border: 3px solid var(--gold); box-shadow: 6px 6px 0 var(--cyan); padding: 14px; margin-bottom: 18px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.spacer { flex: 1; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.btn { background: var(--panel2); border: 2px solid var(--border2); padding: 6px 12px; cursor: pointer; text-transform: uppercase; font-weight: bold; }
.btn:hover:not(:disabled) { border-color: var(--cyan); }
.btn:disabled, .btn.accent:disabled { color: #5a4d74; border-color: #24183a; background: #0b0614; cursor: default; }
.btn.on { background: var(--cyan); border-color: var(--cyan); color: var(--bar); }
.btn.accent { background: var(--gold); border-color: var(--gold); color: var(--bar); }
.tabs { display: flex; gap: 0; margin-bottom: -3px; position: relative; z-index: 1; flex-wrap: wrap; }
.tab { background: var(--panel2); border: 3px solid var(--border2); border-bottom: none; padding: 9px 18px; cursor: pointer; font-weight: bold; text-transform: uppercase; }
.tab.on { background: var(--panel); border-color: var(--gold); color: var(--gold); }
.badge { display: inline-block; min-width: 20px; padding: 0 5px; margin-left: 6px; background: var(--coin); color: var(--bar); font-size: 12px; text-align: center; }
select, input[type=number], input[type=text], textarea { background: var(--bar); border: 2px solid var(--border2); padding: 5px 8px; }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--cyan); }
select.big { min-width: 320px; max-width: 100%; border-color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 14px 26px; }
.stat .lbl { font-size: 12px; color: var(--muted); text-transform: uppercase; margin-bottom: 3px; overflow-wrap: anywhere; }
.stat .line { display: flex; align-items: center; gap: 6px; }
.stat input { width: 110px; text-align: right; }
.stat.changed input { border-color: var(--coin); }
.arrow { width: 34px; height: 32px; border: 2px solid; background: var(--bar); cursor: pointer; font-size: 17px; line-height: 1; padding: 0; }
.arrow.up { color: var(--have); border-color: var(--have); }
.arrow.down { color: var(--missing); border-color: var(--missing); }
.arrow.up:hover { background: var(--have); color: var(--bar); }
.arrow.down:hover { background: var(--missing); color: var(--bar); }
.delta { font-size: 12px; min-width: 70px; }
.delta.plus { color: var(--have); } .delta.minus { color: var(--missing); }
.card { background: var(--panel2); border: 2px solid var(--border2); padding: 10px 12px; margin-bottom: 12px; }
.card.changed { border-color: var(--coin); }
.card h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; }
.note { font-size: 12px; color: var(--muted); margin: 4px 0 8px; overflow-wrap: anywhere; }
.chip { display: inline-block; padding: 1px 6px; border: 1px solid var(--border2); color: var(--purple-light); font-size: 12px; margin-left: 6px; text-transform: uppercase; }
textarea { width: 100%; min-height: 110px; }
table { border-collapse: collapse; width: 100%; }
td:nth-child(-n+3), th { white-space: nowrap; }
td, th { padding: 4px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; overflow-wrap: anywhere; }
th { color: var(--muted); font-size: 12px; text-transform: uppercase; }
.old { color: var(--muted); } .new { color: var(--coin); }
.msg { padding: 8px 12px; border: 2px solid var(--cyan); margin-bottom: 14px; }
.msg.err { border-color: var(--missing); color: var(--missing); }
.pct input { width: 70px; }
label.check { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.empty { color: var(--muted); padding: 20px 0; }
</style>
</head>
<body>
<div class="row" style="margin-bottom:14px">
  <h1>BALANCE-EDITOR</h1>
  <span class="muted small" id="stand"></span>
  <span class="spacer"></span>
  <button class="btn" id="b-open" title="Repo-Ordner (oder dessen data-Ordner) wählen; Speichern schreibt dann direkt hinein">Ordner öffnen</button>
  <button class="btn accent" id="b-save" disabled>Speichern</button>
  <button class="btn" id="b-export" disabled title="Änderungen als Datei für tools/balance_anwenden.py">Änderungen exportieren</button>
  <button class="btn" id="b-reset" disabled>Alles zurück</button>
</div>
<div id="msg"></div>
<div class="tabs" id="tabs"></div>
<div class="panel" id="main">
  <div class="row" style="margin-bottom:12px">
    <div class="row" id="kind"></div>
    <span class="spacer"></span>
    <div class="row pct" id="pct"></div>
  </div>
  <div class="row" style="margin-bottom:14px">
    <select class="big" id="pick"></select>
    <span id="sub" class="row"></span>
  </div>
  <div id="content"></div>
</div>
<div class="panel" id="changes"></div>

<script>
"use strict";
// Eingebettete Daten (bauen.py ersetzt null durch {stand, texts: {pfad: text}, schema, labels}).
const EMBED = /*DATEN*/null/*ENDE*/;

// ---------------------------------------------------------------- JSON mit Python-Format
// Zahlen, die in der Datei mit Komma standen (1.0), bleiben beim Schreiben Kommazahlen.
const FLOATS = new WeakMap();  // Container -> Set der Schlüssel/Indizes mit Kommazahl

function markFloat(c, k) { let s = FLOATS.get(c); if (!s) FLOATS.set(c, s = new Set()); s.add(k); }
function isFloatAt(c, k) { const s = FLOATS.get(c); return !!s && s.has(k); }

function parseJson(text) {
  let i = 0;
  const ws = () => { while (i < text.length && " \t\n\r".includes(text[i])) i++; };
  const fail = (m) => { throw new Error(m + " bei Zeichen " + i); };
  function value(parent, key) {
    ws();
    const ch = text[i];
    if (ch === "{") {
      i++; const o = {}; ws();
      if (text[i] === "}") { i++; return o; }
      for (;;) {
        ws(); if (text[i] !== '"') fail("Schlüssel erwartet");
        const k = str(); ws(); if (text[i++] !== ":") fail(": erwartet");
        o[k] = value(o, k); ws();
        if (text[i] === ",") { i++; continue; }
        if (text[i] === "}") { i++; return o; }
        fail(", oder } erwartet");
      }
    }
    if (ch === "[") {
      i++; const a = []; ws();
      if (text[i] === "]") { i++; return a; }
      for (;;) {
        a.push(value(a, a.length)); ws();
        if (text[i] === ",") { i++; continue; }
        if (text[i] === "]") { i++; return a; }
        fail(", oder ] erwartet");
      }
    }
    if (ch === '"') return str();
    for (const [w, v] of [["true", true], ["false", false], ["null", null]])
      if (text.startsWith(w, i)) { i += w.length; return v; }
    const m = /^-?\d+(\.\d+)?([eE][+-]?\d+)?/.exec(text.slice(i, i + 40));
    if (!m) fail("Wert erwartet");
    i += m[0].length;
    if (/[.eE]/.test(m[0]) && parent) markFloat(parent, key);
    return Number(m[0]);
  }
  function str() {
    const start = i; i++;
    while (text[i] !== '"') { if (text[i] === "\\") i++; i++; if (i >= text.length) fail("Text ohne Ende"); }
    i++;
    return JSON.parse(text.slice(start, i));
  }
  const root = value(null, null); ws();
  if (i < text.length) fail("Zeichen nach dem Ende");
  return root;
}

function pyFloat(x) {
  if (!isFinite(x)) return isNaN(x) ? "NaN" : (x > 0 ? "Infinity" : "-Infinity");
  const a = Math.abs(x);
  if (a !== 0 && (a < 1e-4 || a >= 1e16)) {
    const [m, e] = x.toExponential().split("e");
    const n = Math.abs(Number(e));
    return m + "e" + (e[0] === "-" ? "-" : "+") + (n < 10 ? "0" : "") + n;
  }
  return Number.isInteger(x) ? String(x) + ".0" : String(x);
}

function pyStr(s, ascii) {
  let out = JSON.stringify(s);
  if (ascii) out = out.replace(/[\u007f-￿]/g, (c) => "\\u" + c.charCodeAt(0).toString(16).padStart(4, "0"));
  return out;
}

// Wie Pythons json.dumps(..., indent="\t", ensure_ascii=ascii).
function dumpJson(v, ascii, ind = "", parent = null, key = null) {
  if (v === null) return "null";
  if (typeof v === "boolean") return v ? "true" : "false";
  if (typeof v === "number") return (isFloatAt(parent, key) || !Number.isInteger(v)) ? pyFloat(v) : String(v);
  if (typeof v === "string") return pyStr(v, ascii);
  const inner = ind + "\t";
  if (Array.isArray(v)) {
    if (!v.length) return "[]";
    return "[\n" + v.map((x, k) => inner + dumpJson(x, ascii, inner, v, k)).join(",\n") + "\n" + ind + "]";
  }
  const ks = Object.keys(v);
  if (!ks.length) return "{}";
  return "{\n" + ks.map((k) => inner + pyStr(k, ascii) + ": " + dumpJson(v[k], ascii, inner, v, k)).join(",\n") + "\n" + ind + "}";
}

// Tiefe Kopie, die die Kommazahl-Markierungen mitnimmt.
function clone(v) {
  if (v === null || typeof v !== "object") return v;
  const c = Array.isArray(v) ? v.map(clone) : Object.fromEntries(Object.entries(v).map(([k, x]) => [k, clone(x)]));
  const s = FLOATS.get(v); if (s) FLOATS.set(c, new Set(s));
  return c;
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
const isPrim = (v) => v === null || typeof v !== "object";

// ---------------------------------------------------------------- Dateien
const FILES = {};  // pfad -> {orig, cur, nl, ascii}
let SCHEMA = {}, LABELS = {}, STAND = "", DIR = null, DATA_DIR = null;

function loadTexts(texts) {
  for (const k of Object.keys(FILES)) delete FILES[k];
  for (const [p, t] of Object.entries(texts)) {
    const obj = parseJson(t);
    FILES[p] = { orig: clone(obj), cur: obj, nl: t.endsWith("\n"), ascii: /\\u[0-9a-fA-F]{4}/.test(t) && !/[^\x00-\x7f]/.test(t) };
  }
}
function fileText(p) { const f = FILES[p]; return dumpJson(f.cur, f.ascii) + (f.nl ? "\n" : ""); }

// Unterschiede orig -> cur als Liste {pfad, alt, neu}; Zahlenlisten wie Schaden [min, max] zählen als ein Wert.
function diff(a, b, path = [], out = []) {
  if (same(a, b)) return out;
  const leaf = (x) => isPrim(x) || (Array.isArray(x) && x.every(isPrim));
  if (leaf(a) || leaf(b) || Array.isArray(a) !== Array.isArray(b)) { out.push({ pfad: path, alt: a, neu: b }); return out; }
  if (Array.isArray(a)) {
    if (a.length !== b.length) { out.push({ pfad: path, alt: a, neu: b }); return out; }
    a.forEach((x, k) => diff(x, b[k], path.concat(k), out));
    return out;
  }
  const ka = Object.keys(a), kb = Object.keys(b);
  if (!same(ka.slice().sort(), kb.slice().sort())) { out.push({ pfad: path, alt: a, neu: b }); return out; }
  for (const k of ka) diff(a[k], b[k], path.concat(k), out);
  return out;
}
function allChanges() {
  const out = [];
  for (const [p, f] of Object.entries(FILES)) for (const c of diff(f.orig, f.cur)) out.push(Object.assign({ datei: p }, c));
  return out;
}
function getAt(obj, path) { return path.reduce((o, k) => (o == null ? undefined : o[k]), obj); }
function setAt(obj, path, v) { const parent = getAt(obj, path.slice(0, -1)); parent[path[path.length - 1]] = v; }

// ---------------------------------------------------------------- Modi und Auswahl
const MODES = [
  { id: "gemtd", name: "GemTD" },
  { id: "rogue", name: "GemTD Roguelike" },
  { id: "eeve", name: "eeveTD" },
  { id: "maul", name: "Shopping Maul" },
  { id: "level", name: "Level & EP" },
];
const ROMAN = ["I", "II", "III", "IV", "V", "VI", "VII", "VIII", "IX", "X"];
const ELEMENTS = { nature: "Natur", fire: "Feuer", water: "Wasser", earth: "Erde", storm: "Sturm", magic: "Magie", "": "Grundtürme, Dual-Tower, Fallen" };
const EEVE_KIND = { ground: "Boden", ground_mass: "Masse Boden", air: "Luft", air_mass: "Masse Luft", boss: "Boss", challenge: "Challenge" };

const STAT_LABELS = {
  damage: "Schaden (min / max)", cooldown: "Abklingzeit (s)", range: "Reichweite (Towerbreiten)", range_air: "Reichweite Luft",
  cost: "Kosten", value: "Wert", build_time: "Bauzeit (s)", lumber: "Holz",
  hp: "Leben", speed: "Tempo", armor: "Rüstung", bounty: "Kopfgeld", size: "Größe",
  count: "Anzahl", interval: "Abstand (s)", pack: "Gruppengröße", pack_gap: "Abstand in der Gruppe (s)", jv: "HP-Faktor (jv)",
};
const TOWER_KEYS = ["damage", "cooldown", "range", "range_air", "cost", "value", "build_time"];
const ENEMY_KEYS = ["hp", "speed", "armor", "bounty", "damage", "size", "jv"];
const ENEMY_LABELS = { damage: "Lebensverlust am Ziel", speed: "Tempo" };
const SKIP_KEYS = new Set(["level", "stage", "id", "name", "wc3", "abilities"]);

function towerFiles(eeve) {
  return Object.keys(FILES).filter((p) => p.startsWith("data/towers/") && ((FILES[p].cur.category === "eeve") === eeve));
}
function enemyFile(id) { return "data/enemies/" + id + ".json"; }
// Roguelike: eigene Gegnerwerte je Gegner in einer Datei (Tower, Anzahl und Abstand teilt es mit GemTD)
const ROGUE_FILE = "data/roguelike_enemies.json";
// eeveTD: Items und Marktplatz in einer Datei (Reiter eeveTD, Auswahl „Items“)
const ITEMS_FILE = "data/eeve_items.json";
const ITEM_KEYS = ["value", "damage", "speed", "amount", "stage"];
const ITEM_LABELS = { value: "Wert (Gold, Verkauf zum halben Wert)", damage: "Zusatzschaden", speed: "Angriffstempo (+Anteil)", amount: "Kills", stage: "Stufe (Drop-Pool)" };
const ITEM_STAGES = ["Verbrauch und Zauberschild", "Stufe I", "Stufe II", "Stufe III", "Stufe IV"];
function enemyName(id) { const f = FILES[enemyFile(id)]; return f ? f.cur.name : id; }

// Einträge fürs Auswahlmenü: {key, label, group}
function entries(mode, kind) {
  if (mode === "rogue") mode = "gemtd";
  const out = [];
  if (mode === "level") {
    const f = FILES[LEVEL_FILE]; if (!f) return out;
    if (kind === "modes") return [{ key: "modes", label: "Modus → Profil", group: "" }];
    for (const [id, p] of Object.entries(f.cur.profiles || {})) out.push({ key: id, label: id + " – " + (p.name || ""), group: "" });
    return out;
  }
  if (mode === "gemtd" && kind === "tower") {
    for (const p of towerFiles(false)) {
      const t = FILES[p].cur;
      out.push({ key: p, label: t.name, group: t.category === "gem" ? "Edelsteine" : (t.kind === "trap" ? "Fallen" : "Spezial-Tower") });
    }
  } else if (mode === "eeve" && kind === "tower") {
    for (const p of towerFiles(true)) {
      const t = FILES[p].cur, e = t.eeve || {};
      out.push({ key: p, label: t.name + (e.level ? " (Lv " + e.level + ")" : ""), group: ELEMENTS[e.element || ""] || e.element, sort: e.level || 0 });
    }
  } else if (mode === "eeve" && kind === "items") {
    const f = FILES[ITEMS_FILE]; if (!f) return out;
    for (const [id, it] of Object.entries(f.cur.items || {}))
      out.push({ key: JSON.stringify(["items", id]), label: it.name, group: ITEM_STAGES[it.stage || 0] || "Items", sort: 0 });
    for (const k of Object.keys((f.cur.market || {}).upgrades || {}))
      out.push({ key: JSON.stringify(["market", "upgrades", k]), label: "Upgrade " + f.cur.market.upgrades[k].name, group: "Marktplatz", sort: 1 });
    out.push({ key: JSON.stringify(["market", "shop"]), label: "Angebot (Preise)", group: "Marktplatz", sort: 0 });
    out.push({ key: JSON.stringify(["drops"]), label: "Drop-Chancen", group: "Marktplatz", sort: 2 });
    out.push({ key: JSON.stringify([]), label: "Lager, Plätze, Verkauf", group: "Marktplatz", sort: 3 });
  } else if (mode === "maul" && kind === "tower") {
    const s = FILES["data/maul/shops.json"]; if (!s) return out;
    const shops = s.cur.shops.map((x, i) => [["shops", i], x]);
    for (const k of Object.keys(s.cur)) if (s.cur[k] && Array.isArray(s.cur[k].towers)) shops.push([[k], s.cur[k]]);
    for (const [sp, shop] of shops)
      shop.towers.forEach((t, j) => out.push({ key: JSON.stringify(sp.concat("towers", j)), label: t.name + " (" + t.cost + " Gold)", group: shop.name, sort: 0 }));
    return out;
  } else if (mode === "gemtd") {
    const w = FILES["data/waves/classic.json"]; if (!w) return out;
    w.cur.waves.forEach((wave, i) => out.push({
      key: String(i), group: "",
      label: "Welle " + (i + 1) + ": " + wave.groups.map((g) => enemyName(g.enemy) + " ×" + g.count).join(", "),
    }));
    return out;
  } else if (mode === "eeve") {
    const stages = {};
    for (const p of Object.keys(FILES).filter((p) => p.startsWith("data/enemies/eeve_"))) {
      const st = (FILES[p].cur.eeve || {}).stage || 0; (stages[st] = stages[st] || []).push(p);
    }
    for (const st of Object.keys(stages).map(Number).sort((a, b) => (a || 99) - (b || 99)))
      out.push({ key: String(st), group: "", label: st ? "Gegnerstufe " + st + " (" + stages[st].length + " Gegner)" : "Challenges (" + stages[st].length + ")" });
    return out;
  } else if (mode === "maul") {
    const w = FILES["data/maul/waves.json"]; if (!w) return out;
    w.cur.levels.forEach((l, i) => out.push({ key: String(i), group: "", label: "Level " + l.level + ": " + l.name + " (" + l.kind + ")" }));
    return out;
  }
  out.sort((a, b) => a.group.localeCompare(b.group, "de") || (a.sort || 0) - (b.sort || 0) || a.label.localeCompare(b.label, "de"));
  return out;
}

// ---------------------------------------------------------------- Zustand
const state = { mode: "gemtd", kind: "tower", sel: {}, tier: 0, pct: 5, custom: 15, useCustom: false, allTiers: false, raw: {} };
try { Object.assign(state, JSON.parse(localStorage.getItem("balance_editor") || "{}")); } catch (e) { /* ohne Speicher */ }
function remember() {
  try { localStorage.setItem("balance_editor", JSON.stringify({ mode: state.mode, kind: state.kind, sel: state.sel, pct: state.pct, custom: state.custom, useCustom: state.useCustom, allTiers: state.allTiers })); } catch (e) { /* egal */ }
}
const step = () => (state.useCustom ? Number(state.custom) || 0 : state.pct);
const selKey = () => state.sel[state.mode + "/" + state.kind];

// ---------------------------------------------------------------- Werte ändern
function bump(v, dir, isFloat) {
  const f = 1 + dir * step() / 100;
  if (typeof v !== "number") return v;
  let n = v * f;
  if (!isFloat && Number.isInteger(v)) {
    n = Math.round(n);
    if (n === v && v !== 0 && step() > 0) n = v + dir;
    return n;
  }
  return Number(n.toPrecision(4));
}
// Wert an (Datei, Pfad) um einen Schritt ändern; Listen (Schaden) Eintrag für Eintrag.
function bumpAt(file, path, dir) {
  const root = FILES[file].cur, parent = getAt(root, path.slice(0, -1)), key = path[path.length - 1];
  const v = parent[key];
  if (Array.isArray(v)) v.forEach((x, k) => { v[k] = bump(x, dir, isFloatAt(v, k)); });
  else parent[key] = bump(v, dir, isFloatAt(parent, key));
}
function setNumber(file, path, idx, text) {
  const n = Number(String(text).replace(",", "."));
  if (text === "" || !isFinite(n)) return;
  const v = getAt(FILES[file].cur, path);
  if (Array.isArray(v)) v[idx] = n; else setAt(FILES[file].cur, path, n);
}

// ---------------------------------------------------------------- Oberfläche
const $ = (id) => document.getElementById(id);
function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (k.startsWith("on")) e.addEventListener(k.slice(2), v);
    else if (k === "class") e.className = v;
    else if (v !== undefined && v !== null && v !== false) e.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : String(c));
  return e;
}
function message(text, err = false) { $("msg").replaceChildren(text ? el("div", { class: "msg" + (err ? " err" : "") }, text) : ""); }
const fmtNum = (v) => (typeof v === "number" ? String(Number(v.toPrecision(6))) : String(v));
function pctDelta(a, b) {
  const x = Array.isArray(a) ? a[a.length - 1] : a, y = Array.isArray(b) ? b[b.length - 1] : b;
  if (typeof x !== "number" || typeof y !== "number" || x === y) return null;
  if (x === 0) return "neu";
  return (y > x ? "+" : "") + Math.round((y / x - 1) * 1000) / 10 + " %";
}

// Ein Wert mit grünem und rotem Pfeil. ref = {file, path, others?: [{file, path}]} (others = gleiche Stelle in anderen Stufen)
function statField(label, ref) {
  const cur = getAt(FILES[ref.file].cur, ref.path), old = getAt(FILES[ref.file].orig, ref.path);
  const isNew = old === undefined, changed = !same(cur, old), d = changed && !isNew ? pctDelta(old, cur) : null;
  const go = (dir) => () => { for (const r of [ref].concat(ref.others || [])) if (typeof getAt(FILES[r.file].cur, r.path) !== "undefined") bumpAt(r.file, r.path, dir); render(); };
  const vals = Array.isArray(cur) ? cur : [cur];
  const inputs = vals.map((v, k) => el("input", {
    type: "number", step: "any", value: fmtNum(v), "data-path": ref.path.join("."),
    onchange: (ev) => { setNumber(ref.file, ref.path, k, ev.target.value); render(); },
  }));
  return el("div", { class: "stat" + (changed ? " changed" : "") },
    el("div", { class: "lbl" }, label),
    el("div", { class: "line" },
      el("button", { class: "arrow up", title: "+" + step() + " %", onclick: go(1) }, "▲"),
      inputs,
      el("button", { class: "arrow down", title: "−" + step() + " %", onclick: go(-1) }, "▼"),
      el("span", { class: "delta " + (d && d[0] === "+" ? "plus" : "minus") }, changed ? (isNew ? "neu" : d || "geändert") : ""),
    ),
    changed && !isNew ? el("div", { class: "note" }, "vorher: " + (Array.isArray(old) ? old.map(fmtNum).join(" / ") : fmtNum(old))) : null,
  );
}

function abilityTypes() {
  const types = new Set(Object.keys(SCHEMA));
  const scan = (abs) => (abs || []).forEach((a) => a && a.type && types.add(a.type));
  for (const f of Object.values(FILES)) {
    (f.cur.tiers || []).forEach((t) => scan(t.abilities));
    (f.cur.shops || []).forEach((s) => s.towers.forEach((t) => scan(t.abilities)));
  }
  return [...types].sort();
}
function abilityTemplate(type) {
  if (SCHEMA[type]) {
    const a = { type };
    for (const [k, v] of Object.entries(SCHEMA[type].params)) { a[k] = v.value; if (v.float) markFloat(a, k); }
    return a;
  }
  for (const f of Object.values(FILES)) {
    const lists = (f.cur.tiers || []).map((t) => t.abilities).concat((f.cur.shops || []).flatMap((s) => s.towers.map((t) => t.abilities)));
    for (const l of lists) for (const a of l || []) if (a.type === type) return clone(a);
  }
  return { type };
}

// Formel wie in Godot (Expression) im Browser ausrechnen: nur Zahlen, + - * / ( ), Variablen und Math-Funktionen.
const FORMULA_FUNCS = ["pow", "max", "min", "floor", "ceil", "sqrt", "round", "abs", "log", "exp"];
function formulaFn(src) {
  const bad = (src.match(/[A-Za-z_]\w*/g) || []).filter((w) => !["level", "base", "step", "growth"].includes(w) && !FORMULA_FUNCS.includes(w));
  if (bad.length) throw new Error("unbekannt: " + bad.join(", "));
  if (/[^\w\s+\-*/().,]/.test(src)) throw new Error("nur Zahlen, + − × / ( ) und Funktionen");
  const body = src.replace(/\b(pow|max|min|floor|ceil|sqrt|round|abs|log|exp)\b/g, "Math.$1");
  return new Function("level", "base", "step", "growth", "return (" + body + ");");
}
function levelProfile(id, depth = 0) {
  const all = FILES[LEVEL_FILE].cur.profiles || {}, own = all[id];
  if (!own || depth > 8) return {};
  const p = own.extends ? clone(levelProfile(own.extends, depth + 1)) : {};
  for (const [k, v] of Object.entries(own)) {
    if (["curve", "ep", "per_level", "towers"].includes(k) && v && typeof v === "object" && p[k] && typeof p[k] === "object") Object.assign(p[k], clone(v));
    else p[k] = clone(v);
  }

}
// EP je Stufe und gesamt wie Leveling.table(): [{level, cost, total}], dazu Fehler der Formel.
function levelTable(p) {
  const c = Object.assign({}, CURVE_DEFAULT, p.curve || {}), rows = [];
  let fn = null, err = "";
  if (c.type === "tabelle") fn = (n) => (c.table && c.table.length ? c.table[Math.min(Math.max(n - 1, 0), c.table.length - 1)] : c.base);
  else { try { fn = formulaFn(c.type === "formel" ? c.formula : CURVE_FORMULAS[c.type] || "base"); } catch (e) { err = e.message; fn = () => c.base; } }
  let total = 0;
  for (let n = 1; n <= (p.max_level || 0); n++) {
    let v = Number(fn(n, Number(c.base), Number(c.step), Number(c.growth)));
    if (!isFinite(v)) { err = err || "Formel ergibt bei Level " + n + " keine Zahl"; v = Number(c.base); }
    const cost = Math.max(Math.round(v * Number(c.factor)), 1);
    total += cost;
    rows.push({ level: n, cost, total });
  }

}

    el("div", { class: "stats" }, Object.keys(modes).map((m) => el("div", { class: "stat" + (modes[m] !== f.orig.modes[m] ? " changed" : "") },
      el("div", { class: "lbl" }, MODE_NAMES[m] || m),
      el("select", { onchange: (ev) => { modes[m] = ev.target.value; render(); } },
        el("option", { value: "", selected: !modes[m] }, "keine"),
        ids.map((id) => el("option", { value: id, selected: modes[m] === id }, id + " – " + (f.cur.profiles[id].name || ""))))))));
}
function viewLevelProfile(id) {
  const f = FILES[LEVEL_FILE], own = f.cur.profiles[id], p = levelProfile(id), base = ["profiles", id];
  $("sub").replaceChildren();
  if (!own) return el("div", { class: "empty" }, "Profil fehlt.");
  const out = el("div", {});
  const users = Object.entries(f.cur.modes).filter(([, v]) => v === id).map(([m]) => MODE_NAMES[m] || m);
  out.append(el("div", { class: "note" }, "Profil " + id + (users.length ? " · genutzt von " + users.join(", ") : " · von keinem Modus genutzt") + (own.extends ? " · erbt von " + own.extends : "") + (own.system ? " · Boni und Freischaltungen rechnet der Modus selbst, hier nur die EP-Kurve" : "")));
  out.append(el("div", { class: "stat" }, el("div", { class: "lbl" }, "Name"), el("input", { type: "text", value: own.name || "", style: "width:100%", onchange: (ev) => { own.name = ev.target.value; render(); } })));
  // Geerbte Teile: erst eigene Kopie anlegen
  const section = (key, title, build) => {
    const panel = el("div", { class: "panel", style: "margin:16px 0 0" }, el("h2", {}, title));
    if (!(key in own) && own.extends) {
      panel.append(el("div", { class: "empty" }, "Geerbt von " + own.extends + ". ", el("button", { class: "btn", onclick: () => { own[key] = clone(p[key] !== undefined ? p[key] : (key === "unlocks" ? [] : {})); render(); } }, "Eigene Werte anlegen")));
    } else build(panel);
    out.append(panel);
  };
  section("max_level", "Level", (panel) => panel.append(el("div", { class: "stats" }, statField(LEVEL_LABELS.max_level, { file: LEVEL_FILE, path: base.concat("max_level") }))));
  section("curve", "Benötigte EP (Kurve)", (panel) => {
    const c = own.curve, ct = c.type || "konstant";
    panel.append(el("div", { class: "row", style: "margin-bottom:10px" }, el("span", { class: "muted small" }, "ART"),
      el("select", { class: "curve-type", onchange: (ev) => { c.type = ev.target.value; if (c.type === "formel" && !c.formula) c.formula = CURVE_FORMULAS.linear; render(); } },
        Object.entries(CURVE_TYPES).map(([t, n]) => el("option", { value: t, selected: ct === t }, n)))));
    const keys = ct === "tabelle" ? ["factor"] : ct === "konstant" ? ["base", "factor"] : ct === "linear" ? ["base", "step", "factor"] : ct === "exponentiell" ? ["base", "growth", "factor"] : ["base", "step", "growth", "factor"];
    panel.append(optFields(c, base.concat("curve"), keys, CURVE_DEFAULT));
    if (ct === "formel") {
      let err = ""; try { formulaFn(c.formula); } catch (e) { err = e.message; }
      panel.append(el("div", { class: "stat", style: "margin-top:10px" }, el("div", { class: "lbl" }, "Formel: EP für die Stufe auf „level“ (Variablen level, base, step, growth; Funktionen " + FORMULA_FUNCS.join(", ") + ")"),
        el("input", { type: "text", value: c.formula || "", style: "width:100%", onchange: (ev) => { c.formula = ev.target.value; render(); } }),
        err ? el("div", { class: "msg err" }, "Formel: " + err) : null));
    }
    if (ct === "tabelle") {
      panel.append(el("div", { class: "stat", style: "margin-top:10px" }, el("div", { class: "lbl" }, "EP je Stufe, mit Komma getrennt (die letzte gilt für alle weiteren)"),
        el("input", { type: "text", value: (c.table || []).join(", "), style: "width:100%", onchange: (ev) => {
          c.table = ev.target.value.split(/[,;\s]+/).filter(Boolean).map(Number).filter(isFinite); render(); } })));
    }
    const t = levelTable(p);
    if (t.err) panel.append(el("div", { class: "msg err" }, t.err));
    const show = t.rows.length > 40 ? t.rows.filter((r) => r.level <= 30 || r.level % 10 === 0) : t.rows;
    panel.append(el("div", { class: "note", style: "margin-top:10px" }, "Vorschau (so rechnet das Spiel, jede Stufe mindestens 1 EP):"),
      el("table", { class: "level-table" }, el("tr", {}, ["Level", "EP für die Stufe", "EP gesamt"].map((h) => el("th", {}, h))),
        show.map((r) => el("tr", {}, el("td", {}, r.level), el("td", {}, r.cost), el("td", {}, r.total)))));
  });
  if (!own.system) {
    section("ep", "EP bekommen", (panel) => panel.append(optFields(own.ep, base.concat("ep"), ["kill", "boss", "air", "hp"], { kill: 1.0, boss: 1.0, air: 1.0, hp: 0.01 })));
    section("per_level", "Boni je Level", (panel) => panel.append(optFields(own.per_level, base.concat("per_level"), Object.keys(LEVEL_STATS), { damage: 0.1, speed: 0.05, range: 0.05 })));
    if (!("unlocks" in own) && own.extends) section("unlocks", "Freischaltungen", () => {});
    else out.append(unlockPanel(base.concat("unlocks"), "Freischaltungen (alle Tower)"));
    // Abweichungen je Tower
    const tw = own.towers || {};
    const tp = el("div", { class: "panel", style: "margin:16px 0 0" }, el("h2", {}, "Abweichungen je Tower"),
      el("div", { class: "note" }, "Eigene Freischaltungen kommen zu denen des Profils dazu; Faktor und höchstes Level ersetzen die des Profils."));
    for (const tid of Object.keys(tw)) {
      const tf = Object.keys(FILES).find((x) => x === "data/towers/" + tid + ".json");
      const card = el("div", { class: "card" + (same(tw[tid], ((f.orig.profiles[id] || {}).towers || {})[tid]) ? "" : " changed") },
        el("div", { class: "row" }, el("h3", {}, tf ? FILES[tf].cur.name + " (" + tid + ")" : tid), el("span", { class: "spacer" }),
          el("button", { class: "btn", title: "Abweichung entfernen", onclick: () => { delete tw[tid]; render(); } }, "✕")));
      card.append(optFields(tw[tid], base.concat("towers", tid), ["ep_factor", "max_level"], { ep_factor: 1.5, max_level: p.max_level || 10 }));
      card.append(unlockPanel(base.concat("towers", tid, "unlocks"), "Freischaltungen nur für diesen Tower"));
      tp.append(card);
    }
    const towersIds = Object.keys(FILES).filter((x) => x.startsWith("data/towers/")).map((x) => [x.slice(12, -5), FILES[x].cur.name]).filter(([t]) => !(t in tw));
    const addSel = el("select", {}, towersIds.sort((a, b) => String(a[1]).localeCompare(b[1])).map(([t, n]) => el("option", { value: t }, n + " (" + t + ")")));
    tp.append(el("div", { class: "row" }, addSel, el("button", { class: "btn", onclick: () => { own.towers = own.towers || {}; own.towers[addSel.value] = { unlocks: [] }; render(); } }, "+ Tower")));
    out.append(tp);
  }
  return out;
}

function render() {
  // Ein Eingabefeld meldet beim Entfernen (blur) noch "change": dann danach neu zeichnen statt mittendrin.
  if (rendering) { queueMicrotask(render); return; }
  rendering = true;
  try { draw(); } finally { rendering = false; }
}
function draw() {
  const changes = allChanges();
  const perMode = { gemtd: 0, rogue: 0, eeve: 0, maul: 0, level: 0 };
  for (const c of changes) perMode[modeOf(c.datei)]++;
  $("tabs").replaceChildren(...MODES.map((m) => el("div", {
    class: "tab" + (m.id === state.mode ? " on" : ""), onclick: () => { state.mode = m.id; state.tier = 0; remember(); render(); },
  }, m.name, perMode[m.id] ? el("span", { class: "badge" }, perMode[m.id]) : null)));
  $("kind").replaceChildren(
    ...(state.mode === "level" ? [["profile", "Profile"], ["modes", "Modi"]] : [["enemies", "Enemies"], ["tower", "Tower"]].concat(state.mode === "eeve" ? [["items", "Items"]] : [])).map(([k, n]) => el("button", {
      class: "btn" + (state.kind === k ? " on" : ""), onclick: () => { state.kind = k; state.tier = 0; remember(); render(); },
    }, n)));
  $("pct").replaceChildren(el("span", { class: "muted small" }, "SCHRITT"),
    ...[1, 5, 10].map((v) => el("button", { class: "btn" + (!state.useCustom && state.pct === v ? " on" : ""), onclick: () => { state.pct = v; state.useCustom = false; remember(); render(); } }, v + " %")),
    el("button", { class: "btn" + (state.useCustom ? " on" : ""), onclick: () => { state.useCustom = true; remember(); render(); } }, "Custom"),
    el("input", { type: "number", min: "0", step: "any", value: state.custom, title: "eigener Schritt in %",
      onchange: (ev) => { state.custom = Number(ev.target.value) || 0; state.useCustom = true; remember(); render(); } }), el("span", {}, "%"));

  if (state.kind === "items" && state.mode !== "eeve") state.kind = "tower";
  if (state.mode === "level" && !["profile", "modes"].includes(state.kind)) state.kind = "profile";
  if (state.mode !== "level" && ["profile", "modes"].includes(state.kind)) state.kind = "tower";
  const list = entries(state.mode, state.kind);
  const k = state.mode + "/" + state.kind;
  if (!list.some((e) => e.key === state.sel[k])) state.sel[k] = list.length ? list[0].key : undefined;
  const pick = $("pick");
  const groups = {};
  for (const e of list) (groups[e.group] = groups[e.group] || []).push(e);
  const opt = (e) => el("option", { value: e.key, selected: e.key === state.sel[k] }, e.label);
  pick.replaceChildren(...Object.entries(groups).map(([g, es]) => (g ? el("optgroup", { label: g }, es.map(opt)) : es.map(opt))).flat());
  pick.onchange = () => { state.sel[k] = pick.value; state.tier = 0; remember(); render(); };

  const key = selKey();
  let view;
  if (!Object.keys(FILES).length) view = el("div", { class: "empty" }, "Keine Daten geladen. „Ordner öffnen“ und den Repo-Ordner wählen.");
  else if (key === undefined) view = el("div", { class: "empty" }, "Keine Einträge.");
  else if (state.mode === "level") view = state.kind === "modes" ? viewLevelModes() : viewLevelProfile(key);
  else if (state.kind === "items") view = viewEeveItem(key);
  else if (state.kind === "tower") view = state.mode === "maul" ? viewMaulTower(key) : viewTowerFile(key);
  else if (state.mode === "gemtd" || state.mode === "rogue") view = viewGemWave(Number(key), state.mode === "rogue");
  else if (state.mode === "eeve") view = viewEeveStage(Number(key));
  else view = viewMaulLevel(Number(key));
  const scroll = window.scrollY;
  $("content").replaceChildren(view);
  renderChanges(changes);
  window.scrollTo(0, scroll);

  $("b-save").disabled = !DATA_DIR || !changes.length;
  $("b-export").disabled = !changes.length;
  $("b-reset").disabled = !changes.length;
  $("b-open").disabled = !window.showDirectoryPicker;
  if (!window.showDirectoryPicker) $("b-open").title = "Geht nur in Edge oder Chrome";
}
function modeOf(p) {
  if (p === LEVEL_FILE) return "level";
  if (p === ROGUE_FILE) return "rogue";
  if (p === ITEMS_FILE) return "eeve";
  if (p.startsWith("data/maul/")) return "maul";
  if (p.includes("/eeve_")) return "eeve";
  return "gemtd";
}
function changeLabel(c) {
  const root = FILES[c.datei].cur;
  let name = root.name || c.datei, rest = c.pfad.slice();
  if (c.datei === "data/maul/shops.json") {
    const ti = rest.indexOf("towers"); const t = getAt(root, rest.slice(0, ti + 2)); name = t ? t.name : name; rest = rest.slice(ti + 2);
  } else if (c.datei === "data/maul/waves.json" && rest[0] === "levels") { name = "Level " + (rest[1] + 1); rest = rest.slice(2); }
  else if (c.datei === ITEMS_FILE && rest[0] === "items") { name = (root.items[rest[1]] || {}).name || rest[1]; rest = rest.slice(2); }
  else if (c.datei === ITEMS_FILE) { name = "Marktplatz"; }
  else if (c.datei === LEVEL_FILE && rest[0] === "profiles") { name = "Level-Profil " + rest[1]; rest = rest.slice(2); }
  else if (c.datei === LEVEL_FILE) { name = "Level: Modi"; rest = rest.slice(1); }
  else if (c.datei === ROGUE_FILE && rest[0] === "enemies") { name = enemyName(rest[1]) + " (Roguelike)"; rest = rest.slice(2); }
  else if (rest[0] === "waves") { name = "Welle " + (rest[1] + 1); rest = rest.slice(2); }
  else if (rest[0] === "tiers") { name += " " + ((root.tiers[rest[1]] || {}).name || "Stufe " + (ROMAN[rest[1]] || rest[1] + 1)); rest = rest.slice(2); }
  return [name, rest.join(".")];
}
function renderChanges(changes) {
  const box = $("changes");
  box.replaceChildren(el("h2", {}, "Änderungen (" + changes.length + ")"));
  if (!changes.length) { box.append(el("div", { class: "muted" }, "Noch nichts geändert.")); return; }
  const short = (v) => { const s = isPrim(v) ? fmtNum(v) : JSON.stringify(v); return s.length > 90 ? s.slice(0, 87) + "…" : s; };
  box.append(el("table", {},
    el("tr", {}, ["Modus", "Objekt", "Feld", "vorher", "nachher", "", ""].map((h) => el("th", {}, h))),
    changes.map((c) => {
      const [name, field] = changeLabel(c), d = pctDelta(c.alt, c.neu);
      return el("tr", {},
        el("td", {}, MODES.find((m) => m.id === modeOf(c.datei)).name), el("td", {}, name), el("td", {}, field || "(ganz)"),
        el("td", { class: "old" }, short(c.alt)), el("td", { class: "new" }, short(c.neu)),
        el("td", { class: "delta " + (d && d[0] === "+" ? "plus" : "minus") }, d || ""),
        el("td", {}, el("button", { class: "btn", title: "Diese Änderung zurücknehmen", onclick: () => {
          if (c.pfad.length) setAt(FILES[c.datei].cur, c.pfad, clone(c.alt)); else FILES[c.datei].cur = clone(c.alt);
          render();
        } }, "↺")));
    })));
}

// ---------------------------------------------------------------- Laden und Speichern
const WANTED = (p) => /^data\/(towers|enemies)\/[^/]+\.json$/.test(p) || ["data/waves/classic.json", "data/maul/shops.json", "data/maul/waves.json", ROGUE_FILE, ITEMS_FILE, LEVEL_FILE].includes(p);

// Liest die Fähigkeiten-Liste aus scripts/game/abilities.gd (Zeilen wie "splash": {"label": …, "params": {…}},)
function parseAbilitiesGd(text) {
  const schema = {}, labels = {};
  for (const line of text.split("\n")) {
    let m = /^\t"(\w+)": (\{"label".*\}),\s*$/.exec(line);
    if (m) {
      const raw = parseJson(m[2]), params = {};
      for (const [k, v] of Object.entries(raw.params)) params[k] = { value: v, float: isFloatAt(raw.params, k) };
      schema[m[1]] = { label: raw.label, params };
      continue;
    }
    m = /^\t"(\w+)": ("[^"]*"),\s*$/.exec(line);
    if (m) labels[m[1]] = JSON.parse(m[2]);
  }
  return { schema, labels };
}

async function openFolder() {
  try {
    const dir = await window.showDirectoryPicker({ id: "tdhub", mode: "readwrite" });
    let data = dir, root = null;
    try { data = await dir.getDirectoryHandle("data"); root = dir; } catch (e) { /* data-Ordner selbst gewählt */ }
    const texts = {};
    for (const sub of ["towers", "enemies", "waves", "maul"]) {
      let h; try { h = await data.getDirectoryHandle(sub); } catch (e) { continue; }
      for await (const [name, fh] of h.entries()) {
        const p = "data/" + sub + "/" + name;
        if (fh.kind === "file" && WANTED(p)) texts[p] = await (await fh.getFile()).text();
      }
    }
    for (const f of [ROGUE_FILE, ITEMS_FILE])
      try { texts[f] = await (await (await data.getFileHandle(f.split("/")[1])).getFile()).text(); } catch (e) { /* ältere Stände ohne diese Datei */ }
    if (!Object.keys(texts).length) throw new Error("Im gewählten Ordner liegt kein data/towers. Bitte den Repo-Ordner (oder seinen data-Ordner) wählen.");
    if (allChanges().length && !confirm("Ungespeicherte Änderungen verwerfen und Daten aus dem Ordner laden?")) return;
    if (root) {
      try {
        const gd = await (await (await (await root.getDirectoryHandle("scripts")).getDirectoryHandle("game")).getFileHandle("abilities.gd")).getFile();
        const r = parseAbilitiesGd(await gd.text()); if (Object.keys(r.schema).length) { SCHEMA = r.schema; LABELS = r.labels; }
      } catch (e) { /* bleibt beim eingebetteten Schema */ }
    }
    loadTexts(texts);
    DIR = dir; DATA_DIR = data;
    STAND = "Ordner: " + dir.name;
    $("stand").textContent = STAND;
    message("Daten aus „" + dir.name + "“ geladen. Speichern schreibt direkt in diese Dateien.");
    render();
  } catch (e) {
    if (e.name !== "AbortError") message("Ordner konnte nicht gelesen werden: " + e.message, true);
  }
}

function changedFiles() { return [...new Set(allChanges().map((c) => c.datei))]; }

async function save() {
  const files = changedFiles();
  try {
    for (const p of files) {
      const parts = p.split("/").slice(1);
      let h = DATA_DIR;
      for (const d of parts.slice(0, -1)) h = await h.getDirectoryHandle(d);
      const fh = await h.getFileHandle(parts[parts.length - 1]);
      const w = await fh.createWritable();
      await w.write(fileText(p)); await w.close();
      FILES[p].orig = clone(FILES[p].cur);
    }
    const towers = files.some((p) => p.startsWith("data/towers/"));
    message(files.length + " Datei(en) gespeichert: " + files.join(", ") + "." +
      (towers ? " Tower-Daten geändert: die Tower-Tabelle erneuert der Commit-Hook (oder python3 tools/tower_tabelle.py --kopieren)." : ""));
    render();
  } catch (e) { message("Speichern fehlgeschlagen: " + e.message, true); }
}

function exportChanges() {
  const changes = allChanges().map((c) => ({ datei: c.datei, pfad: c.pfad, objekt: changeLabel(c).join(" "), alt: c.alt, neu: c.neu }));
  const out = { stand: STAND, erstellt: new Date().toISOString(), aenderungen: changes };
  const blob = new Blob([JSON.stringify(out, null, "\t") + "\n"], { type: "application/json" });
  const a = el("a", { href: URL.createObjectURL(blob), download: "balance_aenderungen.json" });
  document.body.append(a); a.click(); a.remove();
  message("balance_aenderungen.json heruntergeladen (" + changes.length + " Änderungen). In einen Thread hochladen oder im Repo: python3 tools/balance_anwenden.py balance_aenderungen.json");
}

$("b-open").onclick = openFolder;
$("b-save").onclick = save;
$("b-export").onclick = exportChanges;
$("b-reset").onclick = () => {
  if (!confirm("Alle Änderungen verwerfen?")) return;
  for (const f of Object.values(FILES)) f.cur = clone(f.orig);
  render();
};
window.addEventListener("beforeunload", (ev) => { if (allChanges().length) { ev.preventDefault(); ev.returnValue = ""; } });

if (EMBED) {
  SCHEMA = EMBED.schema || {}; LABELS = EMBED.labels || {}; STAND = EMBED.stand || "";
  loadTexts(EMBED.texts);
  $("stand").textContent = STAND;
}
render();
</script>
